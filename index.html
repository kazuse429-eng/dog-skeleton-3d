<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>犬の骨格・臓器 3D — 名前から選べるビューア</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>犬の骨格・臓器 3D</h1>
      <p class="sub">中型犬・体高 約38cm</p>
    </header>
    <div class="search">
      <input id="q" type="search" placeholder="名前で探す（例: 上腕骨, femur, 心臓）" autocomplete="off">
    </div>
    <div class="tools">
      <button id="btn-all" title="選択を解除して全体を表示">全体表示</button>
      <button id="btn-expand" title="すべて開く">全部開く</button>
      <button id="btn-collapse" title="すべて閉じる">全部閉じる</button>
    </div>
    <nav id="tree" aria-label="骨の一覧"></nav>
  </aside>
  <main id="stage">
    <canvas id="view"></canvas>
    <div id="labels"></div>
    <div id="hover" hidden></div>
    <section id="quiz" hidden></section>
    <div id="toolbar">
      <button id="btn-side" class="side-btn" title="骨の名前の一覧を開く／閉じる">☰ 一覧</button>
      <div class="seg" role="group" aria-label="表示するもの">
        <button data-layer="bone" class="on">骨格</button>
        <button data-layer="organ">臓器</button>
        <button data-layer="both">両方</button>
      </div>
      <div class="seg" role="group" aria-label="選んでいない骨の表示">
        <button data-mode="dim" class="on">周りを薄く</button>
        <button data-mode="only">選んだ骨だけ</button>
        <button data-mode="all">全部そのまま</button>
      </div>
      <div class="seg" role="group" aria-label="視点">
        <button data-view="left">左</button>
        <button data-view="front">前</button>
        <button data-view="top">上</button>
        <button data-view="persp">斜め</button>
      </div>
      <label class="chk"><input type="checkbox" id="spin"> 自動回転</label>
      <button id="btn-labels" class="side-btn" title="3D の上に名前を表示">🏷 名前</button>
      <button id="btn-quiz" class="quiz-btn" title="クイズで覚える">🎯 クイズ</button>
    </div>
    <section id="card" hidden>
      <button id="card-close" aria-label="閉じる">×</button>
      <div id="card-path"></div>
      <h2 id="card-ja"></h2>
      <div id="card-la"></div>
      <p id="card-note"></p>
      <div id="card-count"></div>
    </section>
    <div id="help">ドラッグ: 回転 ／ 右ドラッグ: 移動 ／ ホイール: 拡大 ／ 骨をクリック: 選択</div>
    <div id="loading">読み込み中…</div>
  </main>
</div>
<script src="vendor/three_bundle.js"></script>
<script src="bones_data.js"></script>
<script src="app.js"></script>
<script src="quiz.js"></script>
</body>
</html>
